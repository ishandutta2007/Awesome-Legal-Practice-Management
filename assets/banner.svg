<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="ambientOrb1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientOrb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldOrb" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.4" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-2deg); }
      }
      @keyframes shimmerSweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 2px; opacity: 0.4; }
        50% { r: 3.5px; opacity: 1; }
      }
      .bg-glow-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 240px 100px;
      }
      .bg-glow-2 {
        animation: pulseGlow 10s ease-in-out infinite alternate;
        transform-origin: 960px 240px;
      }
      .floating-scale {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: 1060px 170px;
      }
      .floating-balance {
        animation: floatReverse 6s ease-in-out infinite;
        transform-origin: 120px 160px;
      }
      .node-1 { animation: nodePulse 3s infinite ease-in-out; }
      .node-2 { animation: nodePulse 4s infinite ease-in-out 1s; }
      .node-3 { animation: nodePulse 3.5s infinite ease-in-out 2s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Lighting in Background (behind text) -->
  <g class="bg-glow-1">
    <circle cx="240" cy="110" r="260" fill="url(#ambientOrb1)" />
  </g>
  <g class="bg-glow-2">
    <circle cx="960" cy="250" r="280" fill="url(#ambientOrb2)" />
  </g>
  <circle cx="600" cy="180" r="320" fill="url(#goldOrb)" />

  <!-- Background Decorative Scales of Justice / Tech Nodes (Left side) -->
  <g class="floating-balance" opacity="0.35">
    <circle cx="120" cy="160" r="70" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" fill="none" />
    <path d="M120 110 L120 210 M90 135 L150 135 M90 135 L75 175 M90 135 L105 175 M150 135 L135 175 M150 135 L165 175" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M70 175 Q90 185 110 175 Z M130 175 Q150 185 170 175 Z" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="85" cy="95" class="node-1" fill="#38bdf8" />
    <circle cx="165" cy="225" class="node-2" fill="#818cf8" />
  </g>

  <!-- Background Decorative Legal Tech Constellation (Right side) -->
  <g class="floating-scale" opacity="0.4">
    <circle cx="1060" cy="170" r="85" stroke="#818cf8" stroke-width="1" stroke-dasharray="6 6" fill="none" />
    <!-- Pillars / Temple Icon -->
    <path d="M1020 220 L1100 220 M1025 215 L1095 215 M1030 215 L1030 145 M1050 215 L1050 145 M1070 215 L1070 145 M1090 215 L1090 145 M1020 145 L1100 145 M1060 115 L1015 145 L1105 145 Z" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round" fill="#fbbf24" fill-opacity="0.1" />
    <circle cx="990" cy="120" class="node-3" fill="#f59e0b" />
    <circle cx="1130" cy="220" class="node-1" fill="#c084fc" />
    <line x1="990" y1="120" x2="1025" y2="145" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.4" />
  </g>

  <!-- Top and Bottom Animated/Gradient Accent Bars -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#lineGrad)" />
  <rect x="0" y="356" width="1200" height="4" fill="url(#lineGrad)" />

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="358" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" fill="none" />

  <!-- FOREGROUND LAYER: Text & Badges (Always crisp & on top) -->
  <g id="foreground" filter="url(#shadow)">
    
    <!-- Category Mini-Tag -->
    <g transform="translate(600, 52)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="-145" cy="0" r="4" fill="#10b981" />
      <text x="-132" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">LEGAL TECH &amp; PRACTICE MANAGEMENT</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#titleGrad)">
      Awesome Legal Practice Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      The Curated Ecosystem of Modern Law Firm SaaS &amp; Open-Source Software
    </text>

    <!-- Value Proposition Sentence -->
    <text x="600" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8">
      Case Intake • Matter Tracking • Trust Accounting (IOLTA) • Time &amp; Billing • Court Calendaring • Legal AI
    </text>

    <!-- Feature Pill Badges Row -->
    <g transform="translate(600, 268)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(-390, 0)">
        <rect x="-10" y="-16" width="145" height="32" rx="16" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2" />
        <text x="62" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#c7d2fe">🏛️ Top SaaS Platforms</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(-215, 0)">
        <rect x="-10" y="-16" width="145" height="32" rx="16" fill="#0f2b2b" stroke="#10b981" stroke-width="1.2" />
        <text x="62" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#a7f3d0">💻 Open-Source Repos</text>
      </g>

      <!-- Pill 3: Market Size & Valuations -->
      <g transform="translate(-40, 0)">
        <rect x="-10" y="-16" width="165" height="32" rx="16" fill="#2d2211" stroke="#f59e0b" stroke-width="1.2" />
        <text x="72" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#fde68a">📊 Valuations &amp; Pricing</text>
      </g>

      <!-- Pill 4: Trust Accounting -->
      <g transform="translate(155, 0)">
        <rect x="-10" y="-16" width="145" height="32" rx="16" fill="#192a3e" stroke="#0ea5e9" stroke-width="1.2" />
        <text x="62" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#bae6fd">⚖️ IOLTA Compliance</text>
      </g>

      <!-- Pill 5: Stargazers Ranked -->
      <g transform="translate(330, 0)">
        <rect x="-10" y="-16" width="135" height="32" rx="16" fill="#2d1738" stroke="#c084fc" stroke-width="1.2" />
        <text x="57" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e9d5ff">⭐ Star Rankings</text>
      </g>
    </g>

    <!-- Bottom Status Text -->
    <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" letter-spacing="0.5">
      UPDATED FOR 2026 • COMMUNITY MAINTAINED • PULL REQUESTS WELCOME
    </text>
  </g>
</svg>
